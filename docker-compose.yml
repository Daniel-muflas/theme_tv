services:
  preview:
    build:
      context: .
      target: preview
    ports:
      - "8080:80"
    volumes:
      # Edits in app/ show up on a browser refresh, no rebuild
      - ./app:/usr/share/nginx/html:ro

  # One-off commands: docker compose run --rm --build cli <ares-command ...>
  cli:
    build:
      context: .
      target: cli
    profiles: ["cli"]
    volumes:
      # Keep the TVs registered with ares-setup-device, and their keys from ares-novacom --getkey, between runs
      - ares-config:/root/.webos
      - ares-keys:/root/.ssh

volumes:
  ares-config:
  ares-keys:
